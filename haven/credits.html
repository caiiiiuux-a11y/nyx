<h1>素材与署名</h1><p>窗边插画、纸纹、动物图钉、导航图标及聊天配图来自金金提供的设计素材。语音消息使用离线合成的普通话样音。</p>
<p>客厅的六组手绘小门由金金与 Copilot 制作。每扇门的开、关状态使用原素材包中的两幅透明图。</p>
<p>聊天交互改编自 StarFold146 的 <a href="https://github.com/StarFold146/nyx/tree/640e5b29ea8ed9fb0232e3d5814efaaaaa197bdc">Nyx</a>，依 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> 使用。本版使用独立消息气泡、纸张主题和本地模拟数据。</p>
<p>客厅「回头聊」的纸条筛选、链接显示与快捷提交改编自 Nyx 的 <a href="https://github.com/StarFold146/nyx/blob/640e5b29ea8ed9fb0232e3d5814efaaaaa197bdc/ta/pocket.js">口袋</a>，回到聊天借鉴其原话定位交互，沿用上述署名和许可。小屋保存收藏时的摘录，并支持标记和恢复「聊过」。</p>
