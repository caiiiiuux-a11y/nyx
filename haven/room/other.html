<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#faf2e9">
  <title>请求 · 杂物间 · Iris &amp; Adrian’s Room</title>
  <link rel="icon" href="/room/assets/nav-other.png">
  <link rel="stylesheet" href="/room/shared.css">
  <link rel="stylesheet" href="/room/other.css">
  <script src="/room/nav.js" defer></script>
  <script type="module" src="/room/other.js"></script>
</head>
<body data-page="other" class="room-layout">
  <main class="other-room">
    <header class="other-heading">
      <p>请求档案</p>
      <h1>请求</h1>
    </header>
    <nav class="request-sections" aria-label="请求设置分类">
      <a href="#routes" aria-current="page">线路</a>
      <button type="button" disabled title="尚未开放">生成参数</button>
      <button type="button" disabled title="尚未开放">自定义请求</button>
      <button type="button" disabled title="尚未开放" lang="en">MCP</button>
      <button type="button" disabled title="尚未开放" lang="en">Skills</button>
    </nav>
    <section id="routes" aria-labelledby="model-title">
      <h2 id="model-title">对话模型</h2>
      <p class="route-hint">为 Adrian 选择当前聊天窗口使用的线路和模型。</p>
      <form id="route-form" autocomplete="off">
        <fieldset id="route-fields" disabled>
          <label for="route-provider">供应商</label>
          <select id="route-provider" required></select>
          <details id="route-connection" hidden>
            <summary>线路连接</summary>
            <div class="connection-body">
              <dl class="connection-info">
                <dt>接口格式</dt><dd>OpenAI 兼容</dd>
                <dt>请求地址</dt><dd id="route-endpoint"></dd>
              </dl>
              <div class="key-label">
                <label for="route-key">API Key</label>
                <button id="forget-key" type="button" hidden>忘记密钥</button>
              </div>
              <input id="route-key" type="password" placeholder="粘贴 API Key" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" aria-describedby="route-key-hint">
              <p id="route-key-hint" class="route-hint"></p>
            </div>
          </details>
          <label for="route-model">回复模型</label>
          <div class="model-row">
            <select id="route-model" required></select>
            <button id="refresh-models" class="icon-button" type="button" title="从当前线路读取模型" aria-label="刷新当前线路的模型列表" hidden>↻</button>
          </div>
          <div class="route-actions">
            <button id="route-save" class="primary" type="submit">保存线路</button>
          </div>
        </fieldset>
      </form>
      <div id="provider-tools" hidden>
        <button id="new-provider" type="button" aria-expanded="false" aria-controls="provider-form">＋ 新建供应商</button>
        <form id="provider-form" autocomplete="off" hidden>
          <fieldset id="provider-fields">
            <legend>新建供应商</legend>
            <label for="provider-name">供应商名称</label>
            <input id="provider-name" required maxlength="64" placeholder="例：家里的 Gemini">
            <dl class="connection-info"><dt>接口格式</dt><dd>OpenAI 兼容</dd></dl>
            <label for="provider-url">Base URL</label>
            <input id="provider-url" type="url" required autocapitalize="none" spellcheck="false" placeholder="https://…/v1">
            <label for="provider-key">API Key <span>（如需验证）</span></label>
            <input id="provider-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" aria-describedby="provider-key-hint">
            <p id="provider-key-hint" class="route-hint"></p>
            <div class="route-actions">
              <button type="submit" class="primary">读取模型并添加</button>
              <button id="cancel-provider" type="button">取消</button>
            </div>
          </fieldset>
        </form>
      </div>
      <p id="route-status" role="status"></p>
    </section>
    <a id="live-room-link" href="http://127.0.0.1:4194/other/" hidden>打开本机 API 试聊 ↗</a>
    <footer><a href="/credits.html">素材与署名</a></footer>
  </main>
  <nav id="room-nav" aria-label="主导航"></nav>
</body>
</html>
