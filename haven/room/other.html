<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#faf2e9">
  <title>线路设置 · Iris &amp; Adrian’s Room</title>
  <link rel="icon" href="/room/assets/nav-other.png">
  <link rel="stylesheet" href="/room/shared.css">
  <link rel="stylesheet" href="/room/other.css">
  <script src="/room/nav.js" defer></script>
  <script type="module" src="/room/other.js"></script>
</head>
<body data-page="other" class="room-layout">
  <main class="other-room">
    <header class="other-heading">
      <div><p>杂物间</p><h1>线路设置</h1></div>
      <img src="/room/assets/nav-other.png" width="44" height="44" alt="">
    </header>
    <form id="route-form" autocomplete="off">
      <fieldset id="route-fields" disabled>
        <legend>对话模型</legend>
        <p class="route-hint">选择 Adrian 在当前聊天窗口使用的线路。</p>
        <label for="route-provider">供应商</label>
        <select id="route-provider" required></select>
        <label for="route-model">回复模型</label>
        <select id="route-model" required></select>
        <details id="route-connection" hidden>
          <summary>线路连接</summary>
          <div class="connection-body">
            <p id="route-endpoint"></p>
            <label for="route-key">线路 API Key</label>
            <input id="route-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" aria-describedby="route-key-hint">
            <p id="route-key-hint" class="route-hint"></p>
          </div>
        </details>
        <div class="route-actions">
          <button id="route-save" type="submit">保存线路</button>
          <a id="route-chat" href="/chat/">打开聊天 <span aria-hidden="true">↗</span></a>
        </div>
      </fieldset>
      <p id="route-status" role="status"></p>
    </form>
    <a id="live-room-link" href="http://127.0.0.1:4194/other/" hidden>打开 Gemini 本机试聊 <span aria-hidden="true">↗</span></a>
    <footer><a href="/credits.html">素材与署名</a></footer>
  </main>
  <nav id="room-nav" aria-label="主导航"></nav>
</body>
</html>
