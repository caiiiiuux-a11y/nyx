<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf4ed">
  <title lang="en">Hallway · Iris &amp; Adrian’s Room</title>
  <link rel="icon" href="/room/assets/pin-fawn.png">
  <link rel="stylesheet" href="/room/shared.css">
  <link rel="stylesheet" href="/room/living-hub.css">
  <script type="module" src="/room/living-hub.js"></script>
  <script src="/room/nav.js" defer></script>
</head>
<body data-page="living" class="room-layout">
  <main class="living-hub" lang="en">
    <header class="parlor-header">
      <h1>Hallway</h1>
      <img src="/room/assets/window-fawn-rabbit.webp" width="436" height="474" alt="">
    </header>
    <ul class="room-doors" aria-label="Room doors">
      <li>
        <a class="room-door" href="/living/pocket/">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/cream-bow-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/cream-bow-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">For Later</span>
        </a>
      </li>
      <li>
        <button class="room-door" type="button" aria-pressed="false">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/sage-tulip-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/sage-tulip-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">Listening Room</span>
          <small>Coming soon</small>
        </button>
      </li>
      <li>
        <button class="room-door" type="button" aria-pressed="false">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/pink-arch-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/pink-arch-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">Iris &amp; Adrian Mailroom</span>
          <small>Coming soon</small>
        </button>
      </li>
      <li>
        <button class="room-door" type="button" aria-pressed="false">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/walnut-lattice-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/walnut-lattice-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">Reading Room</span>
          <small>Coming soon</small>
        </button>
      </li>
      <li>
        <a class="room-door" href="/living/adrian/">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/blue-diamond-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/blue-diamond-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">Adrian’s Room</span>
        </a>
      </li>
      <li>
        <button class="room-door" type="button" aria-pressed="false">
          <span class="door-picture" aria-hidden="true">
            <img class="closed-frame" src="/room/assets/doors/lilac-flower-closed.webp" alt="" width="400" height="560">
            <img class="open-frame" src="/room/assets/doors/lilac-flower-open.webp" alt="" width="400" height="560">
          </span>
          <span class="door-name">Darkroom</span>
          <small>Coming soon</small>
        </button>
      </li>
    </ul>
  </main>
  <nav id="room-nav" aria-label="主导航"></nav>
</body>
</html>
