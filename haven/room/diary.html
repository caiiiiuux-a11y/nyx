<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f9e9eb">
  <title>日历手账 · Iris &amp; Adrian’s Room</title>
  <link rel="icon" href="/room/assets/pin-fawn.png">
  <link rel="stylesheet" href="/room/shared.css">
  <link rel="stylesheet" href="/room/diary.css">
  <script type="module" src="/room/diary.js"></script>
</head>
<body data-page="diary">
  <main class="diary">
    <div class="spread">
    <section class="month" id="month-page" aria-label="日历">
      <header class="month-bar">
        <button type="button" id="previous" aria-label="上个月">‹</button>
        <h1 lang="en"><span id="month-name"></span> <small id="month-year"></small></h1>
        <button type="button" id="next" aria-label="下个月">›</button>
      </header>
      <div class="journal">
      <span class="journal-paper" aria-hidden="true"></span>
      <div class="calendar-paper">
        <span class="calendar-leaf" aria-hidden="true"></span>
        <div class="week" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="diary-days" role="group" aria-label="选择日记日期"></div>
        <p id="month-status" class="status" role="status"></p>
        <div class="calendar-foot">
          <div class="legend" role="group" aria-label="按贴纸高亮日期">
            <button type="button" data-kind="meals" aria-pressed="false"><img src="/room/assets/blue-rim-teacup.webp" alt="">餐食</button>
            <button type="button" data-kind="period" aria-pressed="false"><img src="/room/assets/pin-rabbit.png" alt="">经期</button>
            <button type="button" data-kind="note" aria-pressed="false"><img src="/room/assets/mini-blue-book.webp" alt="">便签</button>
            <button type="button" data-kind="star" aria-pressed="false" aria-label="纸星，阿川的日记"><img src="/room/assets/paper-star.webp" alt="">纸星</button>
          </div>
          <img class="window-rabbit" src="/room/assets/window-rabbit.webp" width="398" height="464" alt="">
        </div>
      </div>
      <section class="memo-board" id="memo-board" aria-labelledby="memo-title">
        <header class="memo-dateline">
          <h2 id="memo-title"><time id="memo-date"></time><span id="memo-week"></span><span class="memo-title-word">便签</span></h2>
          <button type="button" id="open-detail" class="turn-page">明细 <span aria-hidden="true">›</span></button>
        </header>
        <article class="memo-entry" data-note-field="memo" aria-labelledby="iris-memo-title">
          <div class="memo-byline">
            <img src="/room/assets/clip-dot-pink.webp" width="52" height="22" alt="">
            <h3 lang="en" id="iris-memo-title">Iris</h3>
            <button type="button" class="memo-edit" aria-expanded="false" aria-controls="day-memo">写一笔</button>
          </div>
          <p class="handwritten" hidden></p>
          <textarea id="day-memo" aria-label="Iris 的便签全文" rows="3" maxlength="1200" placeholder="写下今天的一件小事…" hidden></textarea>
        </article>
        <article class="memo-entry" data-note-field="adrianMemo" aria-labelledby="adrian-memo-title">
          <div class="memo-byline">
            <img src="/room/assets/clip-dot-blue.webp" width="52" height="22" alt="">
            <h3 lang="en" id="adrian-memo-title">Adrian</h3>
            <button type="button" class="memo-edit" aria-expanded="false" aria-controls="adrian-memo">写一笔</button>
          </div>
          <p class="handwritten" hidden></p>
          <textarea id="adrian-memo" aria-label="Adrian 的便签全文" rows="3" maxlength="1200" placeholder="写下今天的一件小事…" hidden></textarea>
          <div id="signed-notes" aria-label="阿川的署名便签" tabindex="-1"></div>
        </article>
        <p id="memo-load-status" class="status" role="status"></p>
        <button type="button" id="reload-notes" class="text-button" hidden>重新读取便签</button>
        <p id="memo-save-status" class="status" role="status"></p>
      </section>
      </div>
    </section>
    <section class="daily" id="detail-page" aria-labelledby="day-heading" hidden>
      <button type="button" id="back-month" aria-label="返回月历">‹ 月历</button>
      <header class="day-heading"><div><h1 id="day-heading" tabindex="-1"></h1><span id="day-week"></span></div><img src="/room/assets/mailbox-bird.webp" alt=""></header>
      <a id="read-day-notes" class="note-jump" hidden><img src="/room/assets/mini-blue-book.webp" alt=""><span></span>　›</a>
      <div id="day-summary" class="day-summary"></div>
      <div class="record-actions">
        <button type="button" data-editor="meals" aria-expanded="false" aria-controls="record-form" disabled><img src="/room/assets/blue-rim-teacup.webp" alt="">记一餐</button>
        <button type="button" data-editor="period" aria-expanded="false" aria-controls="record-form" disabled><img src="/room/assets/pin-rabbit.png" alt="">记经期</button>
      </div>
      <form id="record-form" class="record-form" hidden>
        <label id="meal-choice">哪一餐<select id="meal-field"><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option><option value="snack">加餐</option></select></label>
        <label id="meal-entry">吃了什么<textarea id="meal-text" maxlength="500" rows="2" placeholder="写下这一餐…"></textarea></label>
        <label id="period-choice" hidden>当天的标记<select id="period-value"><option value="">未标记</option><option value="start">开始了</option><option value="ongoing">经期中</option><option value="end">结束了</option></select></label>
        <div class="editor-actions"><button type="button" id="remove-record" class="quiet" hidden>移除这条记录</button><button type="submit" class="rose-button">保存贴纸</button></div>
      </form>
      <p id="record-status" class="status" role="status"></p>
      <button type="button" id="reload-day" class="text-button" hidden>重新读取</button>
      <section class="star-paper" aria-labelledby="star-heading">
        <header class="notebook-title">
          <img class="notebook-cover" src="/room/assets/mini-blue-book.webp" width="326" height="410" alt="">
          <h3 id="star-heading" tabindex="-1">阿川的日记本</h3>
          <img class="notebook-star" src="/room/assets/paper-star.webp" alt="">
        </header>
        <p id="journal-empty" class="journal-empty" hidden>这一天还没有日记。</p>
        <div id="day-messages"></div>
      </section>
      <details class="journal-prompts" id="journal-prompts" hidden>
        <summary>以前的页边对话</summary>
        <div id="day-prompts"></div>
      </details>
      <details class="storybook" id="storybook">
        <summary><img src="/room/assets/paper-boat-otter.webp" width="48" height="48" alt="">故事本 <span class="fold-icon" aria-hidden="true"></span></summary>
        <div id="story-list"></div>
        <form id="story-form"><label for="story-prompt">想听什么故事？</label>
          <textarea id="story-prompt" rows="2" maxlength="1200" placeholder="比如，一艘只在月亮升起时出航的纸船…" required disabled></textarea>
          <button type="submit" class="rose-button" disabled>请阿川讲故事</button>
        </form>
        <p id="story-status" class="status" role="status"></p>
        <button type="button" id="reload-stories" class="text-button" hidden>重新读取故事本</button>
      </details>
      <details class="task-paper">
        <summary><h3>待办</h3><span class="fold-icon" aria-hidden="true"></span></summary>
        <ul id="day-tasks"></ul>
        <form id="task-form" class="task-form">
          <input type="text" id="new-task" aria-label="新待办" maxlength="120" placeholder="添一件事…" autocomplete="off">
          <button type="submit" aria-label="添加待办">＋</button>
        </form>
      </details>
      <p id="save-status" class="status" role="status"></p>
    </section>
    <nav class="diary-links" aria-label="手账导航">
      <a href="/">‹ 小屋</a>
      <button type="button" id="today">回到今天</button>
    </nav>
    </div>
  </main>
</body>
</html>
