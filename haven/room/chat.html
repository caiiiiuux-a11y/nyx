<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf2e9">
  <title>Adrian · Iris &amp; Adrian’s Room</title>
  <link rel="stylesheet" href="/room/shared.css">
  <link rel="stylesheet" href="/room/chat.css">
  <link rel="stylesheet" href="/room/avatars.css">
  <link rel="icon" href="/room/assets/pin-fawn.png">
</head>
<body data-page="chat">
  <svg aria-hidden="true" class="icon-defs" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-windows" viewBox="0 0 24 24"><path d="M4 8h16M4 15h10"/></symbol>
    <symbol id="i-model" viewBox="0 0 24 24"><path d="m14 2-10 12h7l-1 8 10-13h-7z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></g></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="3" width="13" height="15" rx="2"/><path d="M6 8H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M8 8 4 12l4 4m-4-4h9a6 6 0 0 1 6 6"/></symbol>
    <symbol id="i-keep" viewBox="0 0 24 24"><path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4z"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8m0-12v5h-5"/></symbol>
    <symbol id="i-read" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5m-3 0h6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 20V4M5.5 11 12 4l6.5 7"/></symbol>
  </svg>

  <div class="conversation">
    <header class="chat-heading">
      <button type="button" class="round-button" id="open-windows" aria-label="打开对话窗口列表" aria-haspopup="dialog" aria-controls="window-drawer" aria-expanded="false"><svg><use href="#i-windows"/></svg></button>
      <h1>Adrian</h1>
      <button type="button" class="round-button" id="options" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false" aria-label="聊天设置"><svg><use href="#i-more"/></svg></button>
    </header>
    <p class="chat-date"><time id="room-date"></time></p>
    <main id="messages" role="log" aria-live="polite" aria-label="与 Adrian 的模拟对话"></main>
    <form id="composer" class="composer">
      <div id="store-status" class="store-status" hidden>
        <span id="store-message" role="status"></span>
        <button type="button" id="store-retry" hidden>重试</button>
      </div>
      <div class="pending-details">
        <button type="button" id="quote-chip" hidden title="移除引用"></button>
        <button type="button" id="attachment-chip" hidden title="移除附件"></button>
      </div>
      <div class="input-shell">
        <button type="button" id="attach" class="input-action" aria-label="添加示例附件"><svg><use href="#i-plus"/></svg></button>
        <textarea id="say" rows="1" placeholder="写给 Adrian…" aria-label="写给 Adrian"></textarea>
        <label class="model-chip"><svg aria-hidden="true"><use href="#i-model"/></svg><select id="model" aria-label="回复模型"></select></label>
        <button type="submit" id="send" class="input-action" aria-label="使用声音样例"><svg><use href="#i-mic"/></svg></button>
      </div>
    </form>
    <nav id="room-nav"></nav>
  </div>

  <dialog id="window-drawer" aria-labelledby="windows-title">
    <header><h2 id="windows-title">对话窗口</h2><button type="button" id="close-windows" aria-label="关闭窗口列表">×</button></header>
    <div id="window-list" aria-live="polite"></div>
    <a id="back-to-pocket" href="/living/pocket/" hidden>回到回头聊</a>
  </dialog>
  <dialog id="settings" class="action-panel" aria-labelledby="settings-title">
    <h2 id="settings-title">聊天设置</h2>
    <div class="window-actions">
      <button type="button" id="new-window">新建窗口</button>
    </div>
    <details id="context-settings">
      <summary>上下文与缓存</summary>
      <label class="setting">输入预算<select id="context-budget" aria-label="输入预算"></select></label>
      <div id="cache-controls" hidden>
        <label class="setting">本窗口<select id="cache-mode" aria-label="本窗口缓存策略"></select></label>
        <label class="setting">线路默认发送窗口键<input type="checkbox" id="default-window-key"></label>
        <p class="setting-hint">窗口键帮助接口复用相同的提示前缀。实际命中量可在每条回复下查看。</p>
      </div>
      <p id="cache-unavailable" class="setting-hint" hidden>当前模拟线路没有上游缓存设置。</p>
    </details>
    <label class="setting">显示双方头像<input id="show-avatars" type="checkbox" checked></label>
    <label class="wallpaper">聊天底图<input id="wallpaper" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <button type="button" id="reset-wallpaper">恢复纸纹</button>
    <p id="settings-status" role="status">图片仅保存在当前浏览器。</p>
    <form method="dialog"><button>完成</button></form>
  </dialog>
  <dialog id="avatar-editor" aria-labelledby="avatar-title">
    <h2 id="avatar-title"></h2>
    <img id="avatar-preview" alt="" width="64" height="64">
    <label for="avatar-file">从本机选择图片</label>
    <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp">
    <p id="avatar-status" role="status"></p>
    <button type="button" id="avatar-default"></button>
    <form method="dialog"><button>完成</button></form>
  </dialog>
  <dialog id="choices" class="action-panel" aria-labelledby="choice-title">
    <h2 id="choice-title"></h2>
    <div id="choice-list"></div>
  </dialog>
  <dialog id="memory-details" class="action-panel" aria-labelledby="memory-title" aria-describedby="memory-content">
    <header>
      <h2 id="memory-title"></h2>
      <button type="button" aria-label="关闭摘录" id="close-memory">×</button>
    </header>
    <div id="memory-content"></div>
  </dialog>
  <dialog id="usage-details" class="action-panel" aria-labelledby="usage-title">
    <header><h2 id="usage-title">本条回复用量</h2><button type="button" id="close-usage" aria-label="关闭用量明细">×</button></header>
    <div id="usage-content"></div>
  </dialog>
  <dialog id="photo" aria-label="查看图片">
    <img alt="" id="large-photo">
    <form method="dialog"><button>关闭图片</button></form>
  </dialog>
  <div id="feedback" role="status"></div>
  <script type="module" src="/room/nav.js"></script>
  <script type="module" src="/room/chat.js"></script>
</body>
</html>
